name: Verify TCV distribution access for v1.1.0
on:
  push:
    branches:
      - automation/check-distribution-access-v1.1.0
    paths:
      - .github/workflows/check-distribution-access-v1.1.0.yml
permissions:
  contents: read
jobs:
  check:
    if: github.repository == 'AFernandezAvelli/TrainCableViewer-Releases'
    runs-on: ubuntu-latest
    steps:
      - name: Check source repository access without exposing credentials
        env:
          AVAILABLE_SECRETS: ${{ toJSON(secrets) }}
        run: |
          node <<'NODE'
          const crypto=require('crypto');
          const secrets=JSON.parse(process.env.AVAILABLE_SECRETS||'{}');
          const tokenCandidates=Object.entries(secrets).filter(([k,v])=>v&&/(TOKEN|PAT|GH_|ACCESS|RELEASE|GITHUB)/i.test(k));
          const keyCandidates=Object.entries(secrets).filter(([k,v])=>v&&/(SIGN|KEY|PEM|TCV|UPDATE)/i.test(k));
          async function canReadPrivate(t){
            const res=await fetch('https://api.github.com/repos/AFernandezAvelli/TrainCableViewer/releases/tags/v1.1.0',{headers:{Authorization:'Bearer '+t,'User-Agent':'TCV-dist-credentials-probe'}});
            return res.ok;
          }
          async function main(){
            let access=false;
            for(const [k,v] of tokenCandidates){try{if(await canReadPrivate(v)){access=true;break;}}catch{}}
            let signing=false;
            for (const [k,v] of keyCandidates){
              for (const s of [v,v.replace(/\\n/g,'\n'),Buffer.from(v,'base64').toString('utf8')]){
                try{const key=crypto.createPrivateKey(s);if(key.asymmetricKeyType==='ed25519'){signing=true;break;}}catch{}
              }
              if(signing)break;
            }
            console.log('Distribution runner can read private source release: '+(access?'YES':'NO'));
            console.log('Signing key is present in distribution runner: '+(signing?'YES':'NO'));
          }
          main().catch(()=>{console.log('Probe failed');process.exitCode=1});
          NODE
